<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.png" />
        <link rel="stylesheet" href="./css/fonts.css" />
        <link rel="stylesheet" href="./css/style.css" />
        <script src="./js/script.js" defer></script>
        <title>Fotogram</title>
    </head>
    <body onload="showGallery()">
        <header class="mainHeader">
            <div class="headerContent">
                <img src="./assets/icons/header-icon.png" alt="Fotogram Header Icon" />
            </div>
        </header>
        <main>
            <section class="content">
                <h1 id="myPhotoGalleryTitle"></h1>
                <div id="myPhotoGallery"></div>
                <dialog class="lightboxOverlay" id="lightboxID" role="dialog" aria-labelledby="lightboxImageCaptionID">
                    <div class="lightbox">
                        <header class="lightboxHeader">
                            <figcaption id="lightboxImageCaptionID">Image Caption</figcaption>
                            <button id="buttonCloseLightbox" aria-label="Close lightbox">❌</button>
                        </header>
                        <figure class="lightboxBody">
                            <img id="lightboxImageID" src="" alt="Gallery picture" aria-describedby="lightboxImageCaptionID"/>
                        </figure>
                        <footer class="lightboxFooter">
                            <nav class="lightboxNavigation">
                                <button id="buttonPrevImage" aria-label="Show previous image">←</button>
                                <span id="lightboxImageCounterID"></span>
                                <button id="buttonNextImage" aria-label="Show next image">→</button>
                            </nav>
                        </footer>
                    </div>
                </dialog>
            </section>
        </main>
        <footer class="mainFooter">©️ Daniel Gengel</footer>
    </body>
</html>
