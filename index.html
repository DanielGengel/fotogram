<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/fonts.css" />
        <link rel="stylesheet" href="./css/style.css" />
        <script src="./js/script.js" defer></script>
        <title>Fotogram</title>
    </head>
    <body onload="showGallery()">
        <header>
            <div class="header-content">
                <img src="./assets/icons/header-icon.png" alt="Fotogram Header Icon" />
            </div>
        </header>
        <main>
            <section class="content">
                <div id="myPhotoGalleryTitle"></div>
                <div id="myPhotoGallery"></div>
                <div class="lightboxOverlay" id="lightboxID">
                    <div class="lightbox">
                        <header class="lightboxHeader">
                            <h2 id="lightboxImageCaptionID"></h2>
                            <button id="buttonCloseLightbox">❌</button>
                        </header>
                        <div class="lightboxBody">
                            <img id="lightboxImageID" src="" alt="" />
                        </div>
                        <footer class="lightboxFooter">
                            <nav class="lightboxNavigation">
                                <button id="buttonPrevImage">←</button>
                                <button id="buttonNextImage">→</button>
                            </nav>
                        </footer>
                    </div>
                </div>
            </section>
        </main>
        <footer class="mainFooter"></footer>
    </body>
</html>
